# Среда за разработка: PostgreSQL и Mailpit (A16). Приложението се пуска с dotnet run.
# Паролата идва от файла .env (копие на .env.example), който не се качва в git.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: storycups
      POSTGRES_USER: storycups
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storycups -d storycups"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
